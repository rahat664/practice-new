<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-emerald-50 dark:from-zinc-900 dark:via-zinc-900 dark:to-zinc-900">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold tracking-tight mb-6">Angular Signals + NGXS ডেমো</h1>

    <div class="grid gap-6 lg:grid-cols-2">
      <section class="bg-white/70 dark:bg-zinc-800/60 backdrop-blur rounded-2xl p-6 shadow-sm ring-1 ring-black/5">
        <h2 class="text-xl font-semibold mb-4">১) কাউন্টার</h2>
        <app-couter-card></app-couter-card>
      </section>

      <section class="bg-white/70 dark:bg-zinc-800/60 backdrop-blur rounded-2xl p-6 shadow-sm ring-1 ring-black/5">
        <h2 class="text-xl font-semibold mb-4">২) সার্চ বক্স</h2>
        <app-search-box (selectedUser)="onSelect($event)"></app-search-box>
        <div *ngIf="selected() as u" class="mt-4">
          <p class="text-sm opacity-70 mb-2">নির্বাচিত ইউজার</p>
          <app-randomuser-card [profile]="u"></app-randomuser-card>
        </div>
      </section>

      <section class="bg-white/70 dark:bg-zinc-800/60 backdrop-blur rounded-2xl p-6 shadow-sm ring-1 ring-black/5 lg:col-span-2">
        <h2 class="text-xl font-semibold mb-4">৩) চেকবক্স (two-way)</h2>
        <app-custom-checkbox [(checked)]="agree"></app-custom-checkbox>
        <p class="mt-2">সম্মতি: <span class="font-medium" [class.text-emerald-600]="agree()" [class.text-red-500]="!agree()">{{ agree() ? 'হ্যাঁ' : 'না' }}</span></p>
      </section>

      <section class="lg:col-span-2">
        <h2 class="text-xl font-semibold mb-4">৪) RandomUser Tailwind Card (ডেমো)</h2>
        <app-randomuser-card [profile]="DEMO_PROFILE"></app-randomuser-card>
      </section>

      <section class="lg:col-span-2">
        <h2 class="text-xl font-semibold mb-4">৫) NGXS Todos Board</h2>
        <app-todos-board></app-todos-board>
      </section>
    </div>
  </div>
</div>
