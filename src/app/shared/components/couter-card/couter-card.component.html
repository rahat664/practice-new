<div class="relative group">
  <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 via-fuchsia-500 to-emerald-500 rounded-2xl blur opacity-30 group-hover:opacity-60 transition"></div>
  <div class="relative rounded-2xl bg-white dark:bg-zinc-900 p-6 shadow-xl ring-1 ring-black/5">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-xl font-semibold">Count: {{ count() }}</h3>
      <span class="text-sm px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300">Double: {{ doubled() }}</span>
    </div>
    <div class="flex gap-2">
      <button class="px-4 py-2 rounded-xl bg-indigo-600 text-white shadow hover:shadow-md active:scale-[.99]" (click)="inc()">+1</button>
      <button class="px-4 py-2 rounded-xl bg-fuchsia-600 text-white shadow hover:shadow-md active:scale-[.99]" (click)="dec()">-1</button>
      <button class="px-4 py-2 rounded-xl bg-zinc-200 dark:bg-zinc-700 text-zinc-900 dark:text-zinc-100 hover:bg-zinc-300 dark:hover:bg-zinc-600" (click)="reset()">Reset</button>
    </div>
  </div>
</div>
