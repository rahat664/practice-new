<div class="relative group">
  <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 via-fuchsia-500 to-emerald-500 rounded-2xl blur opacity-40 group-hover:opacity-70 transition"></div>
  <div class="relative rounded-2xl bg-white dark:bg-zinc-900 p-6 shadow-xl ring-1 ring-black/5">
    <div class="flex items-start gap-4">
      <img [src]="avatar()" alt="" class="w-20 h-20 rounded-2xl object-cover ring-4 ring-white dark:ring-zinc-800 shadow-md" />
      <div class="flex-1">
        <h3 class="text-2xl font-semibold tracking-tight">{{ fullName() }}</h3>
        <div class="mt-1 flex flex-wrap gap-2">
          <span class="px-2.5 py-1 text-xs rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300">{{ gender() }}</span>
          <span class="px-2.5 py-1 text-xs rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300">{{ flag() }} {{ profile()?.nat || 'N/A' }}</span>
          <span *ngIf="profile()?.location?.timezone?.offset" class="px-2.5 py-1 text-xs rounded-full bg-fuchsia-100 text-fuchsia-700 dark:bg-fuchsia-500/15 dark:text-fuchsia-300">{{ profile()?.location?.timezone?.offset }} tz</span>
        </div>
      </div>
    </div>

    <div class="mt-5 grid sm:grid-cols-2 gap-4">
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M22 12H2"/><path stroke-width="2" d="M2 6l10 7L22 6"/></svg>
        <a class="text-sm hover:underline" [href]="'mailto:'+(profile()?.email||'')">{{ profile()?.email || '—' }}</a>
      </div>
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M22 16.92v3a2 2 0 0 1-2.18 2A19.7 19.7 0 0 1 3.09 5.18 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.72c.12.81.3 1.6.54 2.36a2 2 0 0 1-.45 2.11L9 10a16 16 0 0 0 5 5l.81-1.09a2 2 0 0 1 2.11-.45c.76.24 1.55.42 2.36.54A2 2 0 0 1 22 16.92z"/></svg>
        <a class="text-sm hover:underline" [href]="'tel:'+(profile()?.cell || profile()?.phone || '')">{{ profile()?.cell || profile()?.phone || '—' }}</a>
      </div>
      <div class="flex items-start gap-3 sm:col-span-2">
        <svg class="w-5 h-5 mt-0.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M12 22s8-4.5 8-12a8 8 0 1 0-16 0c0 7.5 8 12 8 12z"/><circle cx="12" cy="10" r="3" stroke-width="2"/></svg>
        <p class="text-sm leading-relaxed">{{ addressLine() }}</p>
      </div>
    </div>

    <div class="mt-6 flex gap-3">
      <a [href]="'mailto:'+(profile()?.email||'')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium shadow hover:shadow-md active:scale-[.99] transition">Email</a>
      <a [href]="'tel:'+(profile()?.cell || profile()?.phone || '')" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-medium shadow hover:shadow-md active:scale-[.99] transition">Call</a>
    </div>
  </div>
</div>
