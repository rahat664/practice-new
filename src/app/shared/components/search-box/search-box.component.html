<div class="rounded-2xl bg-white dark:bg-zinc-900 p-5 shadow ring-1 ring-black/5">
  <label class="block text-sm font-medium mb-2">সার্চ (নাম/ইমেইল)</label>
  <input class="w-full rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" [ngModel]="query()" (ngModelChange)="query.set($event)" placeholder="e.g. Neel, john@..." />

  <div *ngIf="results().length === 0" class="mt-3 text-sm italic opacity-70">
    ফলাফল নেই (টাইপ করা শুরু করুন)
  </div>

  <ul *ngIf="results().length > 0" class="mt-3 divide-y divide-zinc-100 dark:divide-zinc-800">
    <li *ngFor="let u of results()" (click)="select(u)" class="py-2 px-2 hover:bg-zinc-50 dark:hover:bg-zinc-800 rounded-xl flex items-center gap-2 cursor-pointer">
      <img *ngIf="u.avatar" [src]="u.avatar" width="24" height="24" alt="" class="w-6 h-6 rounded-full ring-1 ring-black/5" />
      <span class="font-medium">{{ u.name }}</span>
      <small class="opacity-70">— {{ u.email }}</small>
    </li>
  </ul>
</div>
