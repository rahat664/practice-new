<div class="rounded-2xl bg-white dark:bg-zinc-900 p-6 shadow ring-1 ring-black/5">
  <div class="flex flex-col sm:flex-row gap-3 sm:items-center">
    <input class="flex-1 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500"
           [ngModel]="title()" (ngModelChange)="title.set($event)" placeholder="Add a task..." />
    <button class="px-4 py-2 rounded-xl bg-indigo-600 text-white shadow hover:shadow-md active:scale-[.99]" (click)="add()">Add</button>
    <button class="px-4 py-2 rounded-xl bg-emerald-600 text-white shadow hover:shadow-md active:scale-[.99]" (click)="load()" [disabled]="loading()">Load Random 5</button>
  </div>

  <div class="mt-4 text-sm opacity-70">Remaining: {{ remaining() }}</div>

  <ul class="mt-4 divide-y divide-zinc-100 dark:divide-zinc-800" *ngIf="items().length; else empty">
    <li *ngFor="let t of items()" class="flex items-center gap-3 py-2">
      <input type="checkbox" class="w-4 h-4" [checked]="t.done" (change)="toggle(t.id)" />
      <span class="flex-1" [class.line-through]="t.done" [class.opacity-60]="t.done">{{ t.title }}</span>
      <button class="text-sm px-3 py-1 rounded-lg bg-zinc-200 dark:bg-zinc-700 hover:bg-zinc-300 dark:hover:bg-zinc-600" (click)="remove(t.id)">Delete</button>
    </li>
  </ul>
  <ng-template #empty>
    <p class="mt-6 text-sm italic opacity-70">কোনো টাস্ক নেই—উপরে লিখে Add চাপুন, অথবা "Load Random 5"।</p>
  </ng-template>
</div>
